<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Distribution target and actor visibility</title><desc id="desc">Among 4,186 eligible titles, target visibility was 94.77 percent and actor visibility was 25.16 percent.</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700">Target-actor visibility (n = 4,186)</text><text x="80" y="140" font-family="Arial, sans-serif" font-size="24">Target position</text><rect x="340" y="110" width="600" height="48" fill="#e5e7eb" rx="5"/><rect x="340" y="110" width="568.62" height="48" fill="#2563eb" rx="5"/><text x="975" y="142" font-family="Arial, sans-serif" font-size="22" font-weight="700">94.77%</text><text x="80" y="235" font-family="Arial, sans-serif" font-size="24">Actor position</text><rect x="340" y="205" width="600" height="48" fill="#e5e7eb" rx="5"/><rect x="340" y="205" width="150.96" height="48" fill="#0f766e" rx="5"/><text x="975" y="237" font-family="Arial, sans-serif" font-size="22" font-weight="700">25.16%</text><text x="600" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">Paired difference: 69.61 percentage points</text></svg>
