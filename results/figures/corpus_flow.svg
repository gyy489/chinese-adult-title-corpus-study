<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc"><title id="title">Corpus formation</title><desc id="desc">Aggregate flow from source records to the final analytical sample.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#1f2937"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><rect x="150" y="50" width="700" height="100" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="500" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Source records</text><text x="500" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">103,743 records</text><line x1="500" y1="150" x2="500" y2="195" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="150" y="195" width="700" height="100" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="500" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Candidate frame</text><text x="500" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">89,161 unique texts</text><line x1="500" y1="295" x2="500" y2="340" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="150" y="340" width="700" height="100" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="500" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Valid AI outputs</text><text x="500" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">38,623 record-level outputs</text><line x1="500" y1="440" x2="500" y2="485" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/><rect x="150" y="485" width="700" height="100" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="500" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Analytical sample</text><text x="500" y="559" text-anchor="middle" font-family="Arial, sans-serif" font-size="22">38,298 unique texts</text><text x="500" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">36,303 probability-track + 1,995 mechanism-enriched texts</text></svg>
